<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Courier New', Courier, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dff1ff"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffe08a"/>
    </marker>
  </defs>

  <!-- Paper -->
  <rect width="1200" height="800" fill="#0e3d78"/>
  <rect width="1200" height="800" fill="url(#major)"/>

  <!-- Sheet border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#dff1ff" stroke-width="2"/>
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#dff1ff" stroke-width="1" stroke-opacity="0.6"/>

  <g fill="none" stroke="#dff1ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- Ground line and hatching -->
    <path d="M60 600H760"/>
    <path stroke-width="1" stroke-opacity="0.7" d="M60 600l-10 10M80 600l-10 10M100 600l-10 10M120 600l-10 10M140 600l-10 10M160 600l-10 10M180 600l-10 10M200 600l-10 10M220 600l-10 10M240 600l-10 10M260 600l-10 10M280 600l-10 10M300 600l-10 10M320 600l-10 10M340 600l-10 10M360 600l-10 10M380 600l-10 10M400 600l-10 10M420 600l-10 10M440 600l-10 10M460 600l-10 10M480 600l-10 10M500 600l-10 10M520 600l-10 10M540 600l-10 10M560 600l-10 10M580 600l-10 10M600 600l-10 10M620 600l-10 10M640 600l-10 10M660 600l-10 10M680 600l-10 10M700 600l-10 10M720 600l-10 10M740 600l-10 10M760 600l-10 10"/>

    <!-- Launch pad and rocket on pad -->
    <path d="M140 600V592H200V600"/>
    <path d="M164 596V560L170 545L176 560V596Z"/>
    <path d="M164 588L156 598L164 594M176 588L184 598L176 594"/>
    <path stroke-width="1" d="M164 566H176"/>

    <!-- Ascent path (solid) -->
    <path d="M170 540C175 400 190 250 215 150" stroke-width="2.4" marker-end="url(#arrow)"/>

    <!-- Descent path (dashed) -->
    <path d="M215 140C250 230 340 350 420 590" stroke-dasharray="9 6" stroke-width="2"/>

    <!-- Recovery parachute and rocket body -->
    <path d="M282 300Q300 268 318 300"/>
    <path d="M282 300Q291 306 300 300Q309 306 318 300" stroke-width="1.2"/>
    <path d="M282 300L297 330M318 300L303 330M300 300V330" stroke-width="1"/>
    <path d="M296 330V348L300 352L304 348V330Z" stroke-width="1.4"/>

    <!-- Landing marker -->
    <path d="M410 590L430 610M430 590L410 610"/>

    <!-- Apogee crosshair -->
    <circle cx="215" cy="140" r="7"/>
    <path d="M200 140H230M215 125V155" stroke-width="1"/>

    <!-- Altitude dimension line -->
    <path d="M110 600V140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path stroke-width="1" d="M110 485H120M110 370H120M110 255H120"/>
    <path stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.8" d="M100 600H140M100 140H200"/>
  </g>

  <!-- Target altitude line (gold) -->
  <path d="M230 140H760" fill="none" stroke="#ffe08a" stroke-width="1.6" stroke-dasharray="14 5 3 5"/>
  <path d="M110 140V600" fill="none" stroke="#ffe08a" stroke-width="0"/>

  <!-- Altitude scale labels -->
  <g fill="#dff1ff" font-size="13" letter-spacing="1">
    <text x="104" y="604" text-anchor="end">0</text>
    <text x="104" y="489" text-anchor="end">200</text>
    <text x="104" y="374" text-anchor="end">400</text>
    <text x="104" y="259" text-anchor="end">600</text>
    <text x="104" y="144" text-anchor="end" fill="#ffe08a" font-weight="bold">800</text>
    <text transform="translate(62 370) rotate(-90)" text-anchor="middle" font-size="14" letter-spacing="3">ALTITUDE (FT)</text>
    <text x="125" y="175" font-size="16" font-weight="bold" fill="#ffe08a" letter-spacing="1">800 FT</text>
    <text x="125" y="193" font-size="12" fill="#ffe08a" letter-spacing="2">EXACT</text>
    <text x="755" y="130" text-anchor="end" font-size="13" fill="#ffe08a" letter-spacing="2">TARGET APOGEE</text>
  </g>

  <!-- Callout numbers -->
  <g fill="none" stroke="#dff1ff" stroke-width="1.4">
    <circle cx="214" cy="568" r="11"/>
    <circle cx="262" cy="112" r="11" stroke="#ffe08a"/>
    <circle cx="352" cy="296" r="11"/>
    <circle cx="456" cy="570" r="11"/>
  </g>
  <g fill="#dff1ff" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="214" y="573">1</text>
    <text x="262" y="117" fill="#ffe08a">2</text>
    <text x="352" y="301">3</text>
    <text x="456" y="575">4</text>
  </g>
  <g fill="#dff1ff" font-size="13" letter-spacing="1">
    <text x="232" y="573">LAUNCH  T = 0 S</text>
    <text x="280" y="117" fill="#ffe08a">APOGEE</text>
    <text x="370" y="301">RECOVERY DESCENT</text>
    <text x="474" y="575">LANDING</text>
  </g>

  <!-- Time scale -->
  <g fill="none" stroke="#dff1ff" stroke-width="1.4">
    <path d="M170 660H740" marker-end="url(#arrow)"/>
    <path stroke-width="1" d="M170 654V666M230 656V664M290 654V666M350 656V664M410 654V666M470 656V664M530 654V666M590 656V664M650 654V666M710 656V664"/>
  </g>
  <rect x="614" y="640" width="36" height="40" fill="#ffe08a" fill-opacity="0.22" stroke="#ffe08a" stroke-width="1.6"/>
  <g fill="#dff1ff" font-size="12" text-anchor="middle">
    <text x="170" y="686">0</text>
    <text x="290" y="686">10</text>
    <text x="410" y="686">20</text>
    <text x="530" y="686">30</text>
    <text x="650" y="700" fill="#ffe08a" font-weight="bold">40</text>
    <text x="614" y="700" fill="#ffe08a" font-weight="bold">37</text>
    <text x="754" y="664" font-size="12" letter-spacing="1">S</text>
  </g>
  <text x="62" y="664" fill="#dff1ff" font-size="14" letter-spacing="3">TIME</text>
  <text x="632" y="632" text-anchor="middle" fill="#ffe08a" font-size="12" letter-spacing="1">LANDING WINDOW</text>

  <!-- Key goals table -->
  <g fill="none" stroke="#dff1ff" stroke-width="1.6">
    <rect x="800" y="70" width="360" height="190"/>
    <path d="M800 112H1160M800 168H1160M800 214H1160" stroke-width="1"/>
    <path d="M920 112V260" stroke-width="1"/>
  </g>
  <g fill="#dff1ff" font-size="14" letter-spacing="2">
    <text x="980" y="98" text-anchor="middle" font-size="15" font-weight="bold">2027 ARC  GOALS</text>
    <text x="814" y="146">ALTITUDE</text>
    <text x="814" y="196">FLIGHT</text>
    <text x="814" y="212" font-size="11">TIME</text>
    <text x="814" y="242">PAYLOAD</text>
  </g>
  <g fill="#ffe08a" font-size="15" font-weight="bold" letter-spacing="1">
    <text x="932" y="146">800 FT, EXACT</text>
    <text x="932" y="196">37 TO 40 SEC</text>
    <text x="932" y="242">RETURNS UNBROKEN</text>
  </g>

  <!-- Legend -->
  <g fill="none" stroke="#dff1ff" stroke-width="1.6">
    <path d="M820 300H880" stroke-width="2.4"/>
    <path d="M820 330H880" stroke-dasharray="9 6" stroke-width="2"/>
    <path d="M820 360H880" stroke="#ffe08a" stroke-dasharray="14 5 3 5"/>
  </g>
  <g fill="#dff1ff" font-size="13" letter-spacing="1">
    <text x="896" y="305">POWERED ASCENT</text>
    <text x="896" y="335">DESCENT UNDER RECOVERY</text>
    <text x="896" y="365">TARGET ALTITUDE</text>
  </g>

  <!-- Notes -->
  <g fill="#dff1ff" font-size="12" letter-spacing="1">
    <text x="800" y="430" font-weight="bold" font-size="13">NOTES</text>
    <text x="800" y="456">1. ROCKET MUST PEAK AT 800 FT.</text>
    <text x="800" y="478">2. LANDING MUST FALL BETWEEN 37 AND</text>
    <text x="800" y="494">   40 SECONDS AFTER LIFTOFF.</text>
    <text x="800" y="516">3. PAYLOAD MUST LAND UNBROKEN.</text>
  </g>

  <!-- Title block -->
  <g fill="none" stroke="#dff1ff" stroke-width="1.6">
    <rect x="800" y="640" width="360" height="110"/>
    <path d="M800 690H1160M800 722H1160" stroke-width="1"/>
    <path d="M1010 722V750" stroke-width="1"/>
  </g>
  <g fill="#dff1ff" letter-spacing="2">
    <text x="980" y="672" text-anchor="middle" font-size="20" font-weight="bold">ANGEL ROCKETRY</text>
    <text x="980" y="711" text-anchor="middle" font-size="14">2027 ARC FLIGHT PROFILE</text>
    <text x="905" y="741" text-anchor="middle" font-size="11">NOT TO SCALE</text>
    <text x="1085" y="741" text-anchor="middle" font-size="11">SHEET 1 OF 1</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
